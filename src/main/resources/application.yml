# ===================================================
# 通用配置（所有环境共享）。环境差异写在 application-dev.yml / application-prod.yml
# ===================================================
server:
  port: 8080
  # 反代部署必开（修订 A8）：AuthRateLimitInterceptor 按 getRemoteAddr() 计数，
  # 套 nginx 后不开关则全体用户共享一个限频桶（10/分 ≈ 全球限流）。
  # 仅在确认上游代理受信后再放开 —— 否则 X-Forwarded-For 可被客户端伪造直接绕过限频。
  # forward-headers-strategy: native

spring:
  application:
    name: tsa-api
  profiles:
    active: dev
  # 重要（踩坑记录）：knife4j 4.5.0 是最后版本，其增强组件按 springdoc 旧接口编译，
  # 与 Boot 3.5 + springdoc 2.8 冲突（NoSuchMethodError: getGroupConfigs）。
  # 排除其自动配置：/doc.html 页面保留可用，仅失去 knife4j 特有的排序/离线文档增强。
  # 若后续 knife4j 发布兼容版本，删掉本段即可恢复全部增强能力。
  autoconfigure:
    exclude: com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
  # 时间序列化：date-format 只对 java.util.Date 生效；
  # LocalDateTime 的 ISO 8601 带时区格式（2026-09-08T08:43:35+08:00）
  # 在 JacksonConfig 里统一配置 —— 契约要求带时区，小程序 iOS 端也才能正确解析。
  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # multipart 容器级阈值（契约 C8 配套）。Boot 默认 max-file-size=1MB 会把合法的 2MB 头像
  # 直接掐死成 500 —— 必须放开；业务上限 2MB 由 FileController 显式校验（才能给出
  # 「文件超限或类型不支持」的 400 提示），这里的值只是防超大 body 打满内存/磁盘的兜底，
  # 击穿时由 GlobalExceptionHandler 翻译成同一句 400。
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

mybatis-plus:
  configuration:
    # 数据库下划线字段 <-> Java 驼峰属性 自动映射（如 created_at <-> createdAt）
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml   # 二期写复杂 SQL 时放这里

# Sa-Token 官方文档：https://sa-token.cc
sa-token:
  # 与前端契约对齐：请求头 Authorization: Bearer <token>
  # （token-name + token-prefix 组合，Sa-Token 会自动剥掉 "Bearer " 前缀）
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800              # token 有效期 7 天
  active-timeout: -1           # 不做临时冻结
  is-concurrent: true          # 允许同一账号多端在线
  is-share: false              # 每次登录生成新 token
  token-style: uuid
  is-log: false

# 接口文档
springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

# ------- 业务配置占位（第二期启用，先留好结构） -------
tsa:
  wechat:
    # 小程序 appid/secret：code2session（二期登录）与 getuserphonenumber（乡会手机号核验）
    # 共用同一对凭据，通过环境变量注入，切勿把明文提交进 Git
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    # 手机号核验逃生通道：true 时把换号 code 原样当手机号返回（本地联调用，
    # 无企业认证主体时调不了真实换号接口）。生产环境必须为 false！
    mock-mode: ${WECHAT_MOCK_MODE:false}
    # 微信登录逃生通道：true 时跳过 jscode2session、固定回 openid=mock-openid-local（本地无凭据联调用）。
    # 与 mock-mode 是两把独立开关、可各开各的分别验证；生产环境必须为 false
    # （WechatClientImpl 启动守卫：非 dev/test 环境任一开关为 true 直接拒绝启动）！
    login-mock-mode: ${WECHAT_LOGIN_MOCK_MODE:false}
  rate-limit:
    # /tsa/auth/** 按 IP 固定 60s 窗口限频（AuthRateLimitInterceptor，内存实现=单实例假设）：
    # 防 verify-phone 被伪造手机号爆破、防 wechat-login 被脚本刷穿凭据/出口带宽、防 admin-login 口令爆破。超限回业务码 1306
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:10}
    verify-phone-per-minute: ${RATE_LIMIT_VERIFY_PER_MIN:5}
    admin-login-per-minute: ${RATE_LIMIT_ADMIN_LOGIN_PER_MIN:5}
    # 社区写端点（发布/点赞/评论/上传）按 IP 固定 1 小时窗口限频（2026-09-14 用户定稿 5 次/时，
    # 全免登录写口一律收口；点赞/评论跨帖子 id 共享同桶，归一化口径见拦截器类注释）
    community-post-per-hour: ${RATE_LIMIT_COMMUNITY_POST_PER_HOUR:5}
    community-comment-per-hour: ${RATE_LIMIT_COMMUNITY_COMMENT_PER_HOUR:5}
    community-like-per-hour: ${RATE_LIMIT_COMMUNITY_LIKE_PER_HOUR:5}
    community-upload-per-hour: ${RATE_LIMIT_COMMUNITY_UPLOAD_PER_HOUR:5}
  files:
    # 文件上传本地磁盘根目录（契约 C8，第 2 棒 FileStorageService 消费本键）：
    # 部署时经环境变量换到持久卷；prod 终态切 OSS 后此键废弃
    dir: ${TSA_FILES_DIR:./upload-data}
  map:
    # 腾讯位置服务 key：地理编码/逆地理编码使用
    qq-key: ${QQ_MAP_KEY:}
